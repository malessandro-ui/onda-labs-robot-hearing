[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "onda-robot-hearing"
version = "0.14.0a0"
description = "Simulator-neutral robot hearing reference foundation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
mujoco = ["mujoco>=3.2"]

[project.scripts]
onda-hearing = "onda_hearing.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
